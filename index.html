<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAWF</title>
    <!-- Favicon added below -->
    <link rel="icon" type="image/png" sizes="32x32" href="PA scratch logo.png">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #121212;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #f8f9fa;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 2rem;
        }

        .logo {
            max-width: 250px;
            height: auto;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.03em;
        }

        p {
            font-size: 1.125rem;
            color: #a0a0a0;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .nino-image {
            max-width: 100%;
            height: auto;
            margin: 1rem 0 2rem 0;
            /* Optional: prevents image dragging */
            -webkit-user-drag: none;
            user-select: none;
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.875rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo implementation -->
        <img src="pawf-logo-98-w3.png" alt="PAWF Logo" class="logo">
        
        <h1>Work in Progress</h1>
        <p>We are currently building the new home for PAWF. Things are coming together behind the scenes, so check back soon.</p>
        
        <!-- Nino Image -->
        <img src="nino.png" alt="Nino" width="1115" height="1115" class="nino-image">

        <div class="footer">
            &copy; 2026 PAWF. All rights reserved.
        </div>
    </div>

    <!-- Right-click prevention script -->
    <script>
        document.addEventListener('contextmenu', function(event) {
            event.preventDefault(); // Stops the right-click menu from appearing
            alert("ROCK HARD FUCK YOU"); // Displays your custom message
        });
    </script>
</body>
</html>
