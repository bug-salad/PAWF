<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAWF | Work in Progress</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #121212;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #f8f9fa;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 2rem;
        }

        .logo {
            max-width: 250px;
            height: auto;
            margin-bottom: 2rem;
            /* Optional: Add a subtle filter if the logo is dark and needs to be visible on a dark background */
            /* filter: invert(1) brightness(2); */
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.03em;
        }

        p {
            font-size: 1.125rem;
            color: #a0a0a0;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .progress-container {
            width: 100%;
            background-color: #2a2a2a;
            border-radius: 999px;
            height: 8px;
            overflow: hidden;
            margin: 2rem 0;
        }

        .progress-bar {
            width: 60%; /* Adjust this percentage to show completion status */
            background-color: #ffffff; /* Update to match PAWF brand color */
            height: 100%;
            border-radius: 999px;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.875rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo implementation -->
        <img src="pawf-logo-98-w3.png" alt="PAWF Logo" class="logo">
        
        <h1>Work in Progress</h1>
        <p>We are currently building the new home for PAWF. Things are coming together behind the scenes, so check back soon.</p>
        
        <!-- Animated progress bar -->
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <div class="footer">
            &copy; 2026 PAWF. All rights reserved.
        </div>
    </div>
</body>
</html>
